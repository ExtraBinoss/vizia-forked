name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: keyframes-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    env:
      RUSTFLAGS: '-D warnings'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: agent/css-keyframes-level1-complete
        fetch-depth: 0
    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
    - name: Materialize final source fixes
      run: |
        python3 - <<'PY'
        from pathlib import Path

        def replace_once(path, old, new):
            p = Path(path)
            text = p.read_text()
            if old in text:
                p.write_text(text.replace(old, new, 1))
                return
            if new in text:
                return
            raise SystemExit(f'anchor not found in {path}')

        replace_once(
            'crates/vizia_style/src/values/color.rs',
            'Self::rgba(rgba.red, rgba.green, rgba.blue, (rgba.alpha * 255.0) as u8)',
            'Self::rgba(rgba.red, rgba.green, rgba.blue, srgb_to_u8(rgba.alpha))',
        )
        replace_once(
            'crates/vizia_core/src/style/css_animation.rs',
            'self.stop_css_on_stores(entity, instance.animation);',
            'self.stop_css_on_stores(entity, instance.instance_id);',
        )
        PY
        cargo fmt --all
        if ! git diff --quiet; then
          git config user.name "OpenAI Keyframes Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(css): finalize animation lifecycle wiring"
          git pull --rebase origin agent/css-keyframes-level1-complete
          git push origin HEAD:agent/css-keyframes-level1-complete
        fi
    - name: Check Format
      run: cargo fmt --all -- --check
    - name: Test style parser
      run: cargo test -p vizia_style
    - name: Test core library
      run: cargo test -p vizia_core --lib
    - name: Check widget gallery
      run: cargo check -p widget_gallery
    - name: Check Clippy
      run: cargo clippy -p vizia_style -p vizia_core --lib -- -D warnings
