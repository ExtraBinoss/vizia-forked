name: Animation Docs Followup Fix

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix live examples and reference UX
        run: |
          python - <<'PY'
          from pathlib import Path

          rust = Path('examples/widget_gallery/src/views/animation.rs')
          text = rust.read_text()

          # Percentage-keyframe reference must render the same keyframes shown in the code pane.
          if '    PercentageKeyframes,\n' not in text:
              text = text.replace('    ViewTimeline,\n    Multiple,', '    ViewTimeline,\n    PercentageKeyframes,\n    Multiple,', 1)

          old_percentage = '''        title: "percentage keyframes",
        css: r#"@keyframes orbit {
  0%   { translate: -120px 0; }
  35%  { translate: -20px -35px; }
  70%  { translate: 80px 24px; }
  100% { translate: 120px 0; }
}"#,
        description: "Multiple offsets, duplicate offsets, implicit endpoints and underlying values are normalized by the CSS animation runtime.",
        example: ExampleKind::Transform,
'''
          new_percentage = '''        title: "percentage keyframes",
        css: r#"@keyframes orbit {
  0%   { translate: -120px 0; }
  35%  { translate: -20px -35px; }
  70%  { translate: 80px 24px; }
  100% { translate: 120px 0; }
}

.target {
  animation: orbit 1.8s ease-in-out
             infinite alternate;
}"#,
        description: "Multiple offsets, duplicate offsets, implicit endpoints and underlying values are normalized by the CSS animation runtime.",
        example: ExampleKind::PercentageKeyframes,
'''
          if old_percentage in text:
              text = text.replace(old_percentage, new_percentage, 1)

          arm = '        ExampleKind::ViewTimeline => render_view_preview(cx),\n'
          if 'ExampleKind::PercentageKeyframes =>' not in text:
              text = text.replace(
                  arm,
                  arm + '        ExampleKind::PercentageKeyframes => motion_track(cx, "animation-doc-percentage"),\n',
                  1,
              )

          # Make backdrop-filter visually obvious: moving color blobs + sharp text behind the animated glass.
          old_backdrop = '''        ExampleKind::BackdropFilter => {
            ZStack::new(cx, |cx| {
                HStack::new(cx, |cx| {
                    Element::new(cx).class("animation-doc-backdrop-a");
                    Element::new(cx).class("animation-doc-backdrop-b");
                    Element::new(cx).class("animation-doc-backdrop-c");
                })
                .class("animation-doc-backdrop-colors");
                Label::new(cx, "BACKDROP").class("animation-doc-backdrop-glass");
            })
            .class("animation-doc-backdrop-stage");
        }
'''
          new_backdrop = '''        ExampleKind::BackdropFilter => {
            ZStack::new(cx, |cx| {
                Element::new(cx)
                    .class("animation-doc-backdrop-blob")
                    .class("animation-doc-backdrop-a");
                Element::new(cx)
                    .class("animation-doc-backdrop-blob")
                    .class("animation-doc-backdrop-b");
                Element::new(cx)
                    .class("animation-doc-backdrop-blob")
                    .class("animation-doc-backdrop-c");
                Label::new(cx, "SHARP  CONTENT")
                    .class("animation-doc-backdrop-behind-text");
                VStack::new(cx, |cx| {
                    Label::new(cx, "BACKDROP FILTER")
                        .class("animation-doc-backdrop-title");
                    Label::new(cx, "blur() over moving content")
                        .class("animation-doc-backdrop-copy");
                })
                .class("animation-doc-backdrop-glass");
            })
            .class("animation-doc-backdrop-stage");
        }
'''
          if old_backdrop in text:
              text = text.replace(old_backdrop, new_backdrop, 1)

          # Put a real Copy CSS button at the bottom-right of the code pane.
          old_code_body = '''                HStack::new(cx, |cx| {
                    Label::new(cx, doc.css)
                        .class("animation-doc-code")
                        .text_wrap(true);
                })
                .class("animation-doc-code-body")
                .alignment(Alignment::TopLeft);
'''
          new_code_body = '''                VStack::new(cx, move |cx| {
                    Label::new(cx, doc.css)
                        .class("animation-doc-code")
                        .text_wrap(true);
                    Element::new(cx).height(Stretch(1.0));
                    HStack::new(cx, move |cx| {
                        Element::new(cx).width(Stretch(1.0));
                        Button::new(cx, |cx| Label::new(cx, "Copy CSS"))
                            .variant(ButtonVariant::Outline)
                            .class("animation-doc-copy-button")
                            .on_press(move |cx| {
                                let _ = cx.set_clipboard(doc.css.to_string());
                            });
                    })
                    .class("animation-doc-copy-row");
                })
                .class("animation-doc-code-body")
                .alignment(Alignment::TopLeft);
'''
          if old_code_body in text:
              text = text.replace(old_code_body, new_code_body, 1)

          rust.write_text(text)

          css = Path('examples/widget_gallery/resources/themes/animation.css')
          c = css.read_text()

          # Active reference item should be unambiguous and override the Text button variant.
          c = c.replace(
              '''button.animation-doc-nav-item-active {
    background-color: var(--background-alt);
    color: var(--foreground);
}
''',
              '''button.animation-doc-nav-item.animation-doc-nav-item-active {
    background-color: var(--primary);
    color: var(--primary-foreground);
    font-weight: bold;
}

button.animation-doc-nav-item.animation-doc-nav-item-active > label {
    color: var(--primary-foreground);
}
''',
              1,
          )

          # Code typography: larger and easier to scan.
          c = c.replace('''hstack.animation-doc-code-body {
    width: 1s;
    height: 388px;
    min-height: 388px;
    padding: 18px;
    alignment: top-left;
    overflow: hidden;
}
''', '''vstack.animation-doc-code-body {
    width: 1s;
    height: 388px;
    min-height: 388px;
    padding: 20px;
    alignment: top-left;
    overflow: hidden;
}
''', 1)
          c = c.replace('''label.animation-doc-code {
    width: 1s;
    height: auto;
    color: var(--muted-foreground);
    font-family: monospace;
    font-size: 13px;
    text-wrap: true;
}
''', '''label.animation-doc-code {
    width: 1s;
    height: auto;
    color: var(--foreground);
    font-family: monospace;
    font-size: 15px;
    line-height: 1.45;
    text-wrap: true;
}

hstack.animation-doc-copy-row {
    width: 1s;
    height: auto;
    min-height: 36px;
    alignment: center-right;
}

button.animation-doc-copy-button {
    min-width: 88px;
}
''', 1)

          # Dedicated percentage-keyframe motion matching the displayed code exactly.
          marker = '''@keyframes doc-settle {
    from { translate: -90px 0px; opacity: 0.35; }
    to { translate: 90px 0px; opacity: 1; }
}
'''
          if '@keyframes doc-percentage' not in c and marker in c:
              c = c.replace(marker, marker + '''
@keyframes doc-percentage {
    0% { translate: -120px 0px; }
    35% { translate: -20px -35px; }
    70% { translate: 80px 24px; }
    100% { translate: 120px 0px; }
}
''', 1)
          anchor = '.animation-doc-direction { animation: doc-motion 1400ms ease-in-out 0s infinite alternate-reverse both running; }\n'
          if '.animation-doc-percentage {' not in c and anchor in c:
              c = c.replace(anchor, anchor + '.animation-doc-percentage { animation: doc-percentage 1800ms ease-in-out 0s infinite alternate both running; }\n', 1)

          # Replace the subtle static backdrop demo with a high-contrast moving one.
          start = c.find('hstack.animation-doc-backdrop-colors {')
          end = c.find('@keyframes doc-background-color', start)
          if start != -1 and end != -1:
              c = c[:start] + '''element.animation-doc-backdrop-blob {
    width: 150px;
    height: 150px;
    corner-radius: 50%;
}

@keyframes doc-backdrop-a-motion {
    from { translate: -135px -55px; scale: 0.78; }
    to { translate: 125px 48px; scale: 1.18; }
}

@keyframes doc-backdrop-b-motion {
    from { translate: 125px -38px; scale: 1.12; }
    to { translate: -120px 58px; scale: 0.74; }
}

@keyframes doc-backdrop-c-motion {
    from { translate: -30px 80px; scale: 0.82; }
    to { translate: 48px -84px; scale: 1.08; }
}

.animation-doc-backdrop-a {
    background-color: #3b82f6;
    animation: doc-backdrop-a-motion 1700ms ease-in-out infinite alternate;
}
.animation-doc-backdrop-b {
    background-color: #f97316;
    animation: doc-backdrop-b-motion 2100ms ease-in-out infinite alternate;
}
.animation-doc-backdrop-c {
    background-color: #22c55e;
    animation: doc-backdrop-c-motion 1900ms ease-in-out infinite alternate;
}

label.animation-doc-backdrop-behind-text {
    width: auto;
    height: auto;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
    color: var(--foreground);
}

@keyframes doc-backdrop {
    0%, 100% { backdrop-filter: blur(0px); }
    50% { backdrop-filter: blur(16px); }
}

vstack.animation-doc-backdrop-glass {
    width: 280px;
    height: 128px;
    padding: 18px 22px;
    gap: 6px;
    alignment: center;
    corner-radius: 14px;
    background-color: #66ffffff;
    animation: doc-backdrop 1800ms ease-in-out infinite;
}

label.animation-doc-backdrop-title {
    width: 1s;
    height: auto;
    text-align: center;
    font-weight: bold;
    color: #111827;
}

label.animation-doc-backdrop-copy {
    width: 1s;
    height: auto;
    text-align: center;
    font-size: 12px;
    color: #374151;
}

''' + c[end:]

          css.write_text(c)
          PY
          cargo fmt
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes"
          else
            git add examples/widget_gallery/src/views/animation.rs examples/widget_gallery/resources/themes/animation.css
            git commit -m "fix: polish live animation reference examples"
            git push origin HEAD:agent/css-keyframes-level2
          fi

# trigger follow-up
