name: Animation Docs Validation

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Animation stylesheet smoke test
        run: cargo test -p widget_gallery animation_gallery_stylesheet_loads
