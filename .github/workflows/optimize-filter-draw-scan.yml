name: Optimize Filter Draw Scan

on:
  push:
    branches: [ agent/css-keyframes-level1-complete ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level1-complete
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply filter draw optimization
        run: python tools/optimize_filter_draw_scan.py
      - name: Format
        run: cargo fmt
      - name: Commit materialized changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ExtraBinoss@users.noreply.github.com"
          git add crates/vizia_core/src/style/mod.rs crates/vizia_core/src/systems/style.rs crates/vizia_core/src/systems/animation.rs crates/vizia_core/src/systems/draw.rs crates/vizia_core/src/modifiers/style.rs
          git commit -m "perf: avoid full-tree filter draw scan"
          git push origin HEAD:agent/css-keyframes-level1-complete
