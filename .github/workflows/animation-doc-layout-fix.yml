name: Animation Docs Layout Fix

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix animation reference layout and previews
        run: |
          python - <<'PY'
          from pathlib import Path

          rust = Path('examples/widget_gallery/src/views/animation.rs')
          text = rust.read_text()

          if text.startswith('use vizia::prelude::*;'):
              text = text.replace(
                  'use vizia::prelude::*;',
                  'use vizia::{icons::ICON_HEART, prelude::*};',
                  1,
              )

          simple_anchor = '''fn simple_stage(cx: &mut Context, label: &'static str, class: &'static str) {
              HStack::new(cx, move |cx| {
                  Label::new(cx, label).class("animation-doc-target").class(class);
              })
              .class("animation-doc-stage")
              .alignment(Alignment::Center);
          }
          '''
          simple_replacement = simple_anchor + '''
          fn surface_stage(cx: &mut Context, label: &'static str, class: &'static str) {
              HStack::new(cx, move |cx| {
                  Label::new(cx, label)
                      .class("animation-doc-target")
                      .class("animation-doc-surface-target")
                      .class(class);
              })
              .class("animation-doc-stage")
              .alignment(Alignment::Center);
          }
          '''
          if 'fn surface_stage(' not in text:
              if simple_anchor not in text:
                  raise SystemExit('simple_stage anchor not found')
              text = text.replace(simple_anchor, simple_replacement, 1)

          replacements = {
              'simple_stage(cx, "background", "animation-doc-background-color")':
                  'surface_stage(cx, "background", "animation-doc-background-color")',
              'simple_stage(cx, "background geometry", "animation-doc-background-geometry")':
                  'surface_stage(cx, "background geometry", "animation-doc-background-geometry")',
              'simple_stage(cx, "border width", "animation-doc-border-width")':
                  'surface_stage(cx, "border width", "animation-doc-border-width")',
              'simple_stage(cx, "border color", "animation-doc-border-color")':
                  'surface_stage(cx, "border color", "animation-doc-border-color")',
              'simple_stage(cx, "radius", "animation-doc-radius")':
                  'surface_stage(cx, "radius", "animation-doc-radius")',
              'simple_stage(cx, "outline", "animation-doc-outline")':
                  'surface_stage(cx, "outline", "animation-doc-outline")',
              'simple_stage(cx, "shadow", "animation-doc-shadow")':
                  'surface_stage(cx, "shadow", "animation-doc-shadow")',
              'simple_stage(cx, "Animated text", "animation-doc-text-color")':
                  'surface_stage(cx, "Animated text", "animation-doc-text-color")',
              'simple_stage(cx, "Font size", "animation-doc-font-size")':
                  'surface_stage(cx, "Font size", "animation-doc-font-size")',
              'simple_stage(cx, "Spacing", "animation-doc-letter-spacing")':
                  'surface_stage(cx, "Spacing", "animation-doc-letter-spacing")',
              'simple_stage(cx, "Text paint", "animation-doc-text-paint")':
                  'surface_stage(cx, "Text paint", "animation-doc-text-paint")',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old_fill = 'ExampleKind::Fill => simple_stage(cx, "fill", "animation-doc-fill"),'
          new_fill = '''ExampleKind::Fill => {
                  HStack::new(cx, |cx| {
                      Svg::new(cx, ICON_HEART).class("animation-doc-fill-icon");
                  })
                  .class("animation-doc-stage")
                  .alignment(Alignment::Center);
              }'''
          if old_fill in text:
              text = text.replace(old_fill, new_fill, 1)

          content_start = text.index('fn render_doc_content(cx: &mut Context, index: usize) {')
          nav_start = text.index('\nfn build_doc_navigation', content_start)
          content_replacement = r'''fn render_doc_content(cx: &mut Context, index: usize) {
              let doc = &DOCS[index];
              VStack::new(cx, move |cx| {
                  Label::new(cx, doc.title).class("animation-doc-title");
                  Label::new(cx, doc.description).class("animation-doc-description");

                  HStack::new(cx, move |cx| {
                      VStack::new(cx, |cx| {
                          HStack::new(cx, |cx| {
                              Label::new(cx, "CSS").class("animation-doc-pane-title");
                          })
                          .class("animation-doc-code-header");

                          HStack::new(cx, |cx| {
                              Label::new(cx, doc.css)
                                  .class("animation-doc-code")
                                  .text_wrap(true);
                          })
                          .class("animation-doc-code-body")
                          .alignment(Alignment::TopLeft);
                      })
                      .class("animation-doc-code-pane");

                      VStack::new(cx, move |cx| {
                          HStack::new(cx, |cx| {
                              Label::new(cx, "Result").class("animation-doc-pane-title");
                          })
                          .class("animation-doc-result-header");

                          VStack::new(cx, move |cx| render_preview(cx, doc.example))
                              .class("animation-doc-result-body");
                      })
                      .class("animation-doc-result-pane");
                  })
                  .class("animation-doc-example");

                  VStack::new(cx, |cx| {
                      Label::new(cx, "Implementation note").class("animation-doc-note-title");
                      Label::new(cx, "CSS animations are sampled directly through Vizia's existing AnimatableSet / AnimatableVarSet property stores. The documentation mounts only the selected live example, so browsing the catalogue does not keep unrelated animations running in the background.").class("animation-doc-note-copy");
                  })
                  .class("animation-doc-note");
              })
              .class("animation-doc-content");
          }
          '''
          text = text[:content_start] + content_replacement + text[nav_start:]

          nav_start = text.index('fn build_doc_navigation(cx: &mut Context, selected: Signal<usize>) {')
          animation_start = text.index('\npub fn animation', nav_start)
          nav_replacement = r'''fn build_doc_navigation(cx: &mut Context, selected: Signal<usize>) {
              ScrollView::new(cx, move |cx| {
                  VStack::new(cx, move |cx| {
                      Label::new(cx, "Animation reference").class("animation-doc-nav-title");
                      let mut category: Option<&'static str> = None;
                      for (index, doc) in DOCS.iter().enumerate() {
                          if category != Some(doc.category) {
                              category = Some(doc.category);
                              Label::new(cx, doc.category).class("animation-doc-nav-category");
                          }
                          Button::new(cx, move |cx| Label::new(cx, doc.title))
                              .variant(ButtonVariant::Text)
                              .class("animation-doc-nav-item")
                              .toggle_class(
                                  "animation-doc-nav-item-active",
                                  selected.map(move |current| *current == index),
                              )
                              .on_press(move |_cx| selected.set(index));
                      }
                  })
                  .class("animation-doc-nav");
              })
              .show_horizontal_scrollbar(false)
              .class("animation-doc-nav-scroll");
          }
          '''
          text = text[:nav_start] + nav_replacement + text[animation_start:]
          rust.write_text(text)

          css = Path('examples/widget_gallery/resources/themes/animation.css')
          c = css.read_text()

          c = c.replace('''hstack.animation-doc-layout {
              width: 1s;
              height: auto;
              gap: 24px;
              align-items: flex-start;
          }

          vstack.animation-doc-nav {
              width: 238px;
              min-width: 238px;
              height: auto;
              padding-right: 18px;
              border-right-width: 1px;
              border-right-color: var(--border);
              gap: 2px;
          }
          ''', '''hstack.animation-doc-layout {
              width: 1s;
              height: 720px;
              min-height: 720px;
              gap: 24px;
              align-items: flex-start;
              overflow: hidden;
          }

          scrollview.animation-doc-nav-scroll {
              width: 250px;
              min-width: 250px;
              height: 720px;
              border-right-width: 1px;
              border-right-color: var(--border);
          }

          vstack.animation-doc-nav {
              width: 232px;
              min-width: 232px;
              height: auto;
              padding-right: 10px;
              gap: 2px;
          }
          ''')

          c = c.replace('''vstack.animation-doc-content {
              width: 1s;
              min-width: 520px;
              height: auto;
              gap: 14px;
          }
          ''', '''vstack.animation-doc-content {
              width: 1s;
              min-width: 520px;
              height: 720px;
              min-height: 720px;
              gap: 14px;
              overflow: hidden;
          }
          ''')

          c = c.replace('''hstack.animation-doc-example {
              width: 1s;
              height: auto;
              min-height: 390px;
              border-width: 1px;
              border-color: var(--border);
              corner-radius: 6px;
              overflow: hidden;
              gap: 0px;
              align-items: stretch;
          }

          vstack.animation-doc-code-pane,
          vstack.animation-doc-result-pane {
              width: 1s;
              min-width: 380px;
              min-height: 390px;
              height: auto;
          }
          ''', '''hstack.animation-doc-example {
              width: 1s;
              height: 430px;
              min-height: 430px;
              border-width: 1px;
              border-color: var(--border);
              corner-radius: 6px;
              overflow: hidden;
              gap: 0px;
              align-items: stretch;
          }

          vstack.animation-doc-code-pane,
          vstack.animation-doc-result-pane {
              width: 1s;
              min-width: 360px;
              height: 430px;
              min-height: 430px;
          }
          ''')

          c = c.replace('''label.animation-doc-code {
              width: 1s;
              height: auto;
              padding: 18px;
              color: var(--muted-foreground);
              font-family: monospace;
              font-size: 13px;
              text-wrap: true;
          }
          ''', '''hstack.animation-doc-code-body {
              width: 1s;
              height: 388px;
              min-height: 388px;
              padding: 18px;
              alignment: top-left;
              overflow: hidden;
          }

          label.animation-doc-code {
              width: 1s;
              height: auto;
              color: var(--muted-foreground);
              font-family: monospace;
              font-size: 13px;
              text-wrap: true;
          }
          ''')

          old_result_header = '''vstack.animation-doc-result-pane > label.animation-doc-pane-title {
              width: 1s;
              height: 42px;
              min-height: 42px;
              padding: 0px 14px;
              alignment: center-left;
              border-bottom-width: 1px;
              border-bottom-color: var(--border);
          }
          '''
          new_result_header = '''hstack.animation-doc-result-header {
              width: 1s;
              height: 42px;
              min-height: 42px;
              padding: 0px 14px;
              alignment: center-left;
              border-bottom-width: 1px;
              border-bottom-color: var(--border);
          }

          vstack.animation-doc-result-body {
              width: 1s;
              height: 388px;
              min-height: 388px;
              alignment: center;
              overflow: hidden;
          }
          '''
          c = c.replace(old_result_header, new_result_header)

          c = c.replace('''hstack.animation-doc-stage,
          zstack.animation-doc-stage {
              width: 1s;
              height: 340px;
              padding: 28px;
              alignment: center;
              overflow: hidden;
          }
          ''', '''hstack.animation-doc-stage,
          zstack.animation-doc-stage {
              width: 1s;
              height: 388px;
              min-height: 388px;
              padding: 34px;
              alignment: center;
              overflow: hidden;
          }
          ''')

          c = c.replace('''zstack.animation-doc-track {
              width: 1s;
              height: 340px;
              alignment: center;
              overflow: hidden;
          }
          ''', '''zstack.animation-doc-track {
              width: 1s;
              height: 388px;
              min-height: 388px;
              alignment: center;
              overflow: hidden;
          }
          ''')

          c = c.replace('''scrollview.animation-doc-scrollview {
              width: 1s;
              height: 340px;
              background-color: var(--background);
          }
          ''', '''scrollview.animation-doc-scrollview {
              width: 1s;
              height: 388px;
              min-height: 388px;
              background-color: var(--background);
          }
          ''')

          c = c.replace('''zstack.animation-doc-backdrop-stage {
              width: 1s;
              height: 340px;
              alignment: center;
              overflow: hidden;
          }
          ''', '''zstack.animation-doc-backdrop-stage {
              width: 1s;
              height: 388px;
              min-height: 388px;
              alignment: center;
              overflow: hidden;
          }
          ''')

          insert_after = '''.animation-doc-target {
              width: auto;
              height: auto;
              min-width: 130px;
              min-height: 58px;
              padding: 14px 20px;
              alignment: center;
              corner-radius: 8px;
              background-color: var(--primary);
              color: var(--primary-foreground);
              font-weight: bold;
          }
          '''
          surface_styles = insert_after + '''
          label.animation-doc-surface-target {
              width: 230px;
              min-width: 230px;
              min-height: 104px;
              padding: 24px 30px;
              alignment: center;
              text-align: center;
              text-wrap: true;
          }

          svg.animation-doc-fill-icon {
              width: 104px;
              height: 104px;
              fill: #3b82f6;
              animation: doc-fill 1400ms ease-in-out infinite alternate;
          }
          '''
          if 'label.animation-doc-surface-target' not in c:
              c = c.replace(insert_after, surface_styles, 1)

          c = c.replace('.animation-doc-border-color { border-width: 5px; animation: doc-border-color 1400ms ease-in-out infinite alternate; }', '.animation-doc-border-color { border-width: 5px; border-style: solid; animation: doc-border-color 1400ms ease-in-out infinite alternate; }')
          c = c.replace('.animation-doc-text-color { background-color: transparent; animation: doc-text-color 1200ms ease-in-out infinite alternate; }', '.animation-doc-text-color { background-color: var(--background-alt); animation: doc-text-color 1200ms ease-in-out infinite alternate; }')
          c = c.replace('.animation-doc-font-size { background-color: transparent; color: var(--foreground); animation: doc-font-size 1600ms ease-in-out infinite alternate; }', '.animation-doc-font-size { background-color: var(--background-alt); color: var(--foreground); animation: doc-font-size 1600ms ease-in-out infinite alternate; }')
          c = c.replace('.animation-doc-letter-spacing { background-color: transparent; color: var(--foreground); animation: doc-letter-spacing 1500ms ease-in-out infinite alternate; }', '.animation-doc-letter-spacing { background-color: var(--background-alt); color: var(--foreground); animation: doc-letter-spacing 1500ms ease-in-out infinite alternate; }')
          c = c.replace('''label.animation-doc-line-height {
              width: auto;
              height: auto;
              color: var(--foreground);
              font-size: 22px;
              text-align: center;
              animation: doc-line-height 1500ms ease-in-out infinite alternate;
          }
          ''', '''label.animation-doc-line-height {
              width: 250px;
              min-width: 250px;
              min-height: 140px;
              height: auto;
              padding: 22px 28px;
              alignment: center;
              corner-radius: 8px;
              background-color: var(--background-alt);
              color: var(--foreground);
              font-size: 22px;
              text-align: center;
              animation: doc-line-height 1500ms ease-in-out infinite alternate;
          }
          ''')
          c = c.replace('''@keyframes doc-fill { from { fill: #3b82f6; } to { fill: #22c55e; } }
          .animation-doc-fill { animation: doc-fill 1400ms ease-in-out infinite alternate; }
          ''', '''@keyframes doc-fill { from { fill: #3b82f6; } to { fill: #22c55e; } }
          ''')

          css.write_text(c)
          PY
          cargo fmt
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/widget_gallery/src/views/animation.rs examples/widget_gallery/resources/themes/animation.css
          git commit -m "ui: fix animation reference layout and breathing room"
          git push origin HEAD:agent/css-keyframes-level2
