name: Level 2 Clippy Fix

on:
  push:
    branches: [ agent/css-keyframes-level2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply clippy fixes
        run: python tools/level2_clippy_fix.py
      - name: Format
        run: cargo fmt
      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo "No source fixes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/vizia_core/src/storage/animatable_set.rs crates/vizia_core/src/storage/animatable_var_set.rs
          git commit -m "fix: document Level 2 CSS store update operation"
          git push origin HEAD:agent/css-keyframes-level2
