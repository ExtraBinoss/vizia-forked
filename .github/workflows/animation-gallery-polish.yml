name: Animation Gallery Polish

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  polish-and-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize Vizia CSS and format Rust
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("examples/widget_gallery/resources/themes/animation.css")
          text = path.read_text()
          text = text.replace("    margin-bottom: 12px;\n", "")
          text = text.replace("    margin-right: 3px;\n", "")
          path.write_text(text)
          PY
          cargo fmt
      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add examples/widget_gallery/src/views/animation.rs examples/widget_gallery/resources/themes/animation.css
            git commit -m "style: normalize streamlined animation gallery"
            git push origin HEAD:agent/css-keyframes-level2
          fi
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb-dev libxcb-dri2-0-dev libgl1-mesa-dev libxcb-icccm4-dev \
            libxcursor-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfreetype6-dev libfontconfig1-dev libwayland-dev
      - name: Parse animation stylesheet in Context
        run: cargo test -p widget_gallery animation_gallery_stylesheet_loads
