name: Animation Gallery Polish

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  polish-and-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize gallery source and format Rust
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path("examples/widget_gallery/resources/themes/animation.css")
          text = css.read_text()
          text = text.replace("    margin-bottom: 12px;\n", "")
          text = text.replace("    margin-right: 3px;\n", "")
          css.write_text(text)

          rust = Path("examples/widget_gallery/src/views/animation.rs")
          text = rust.read_text()
          text = text.replace(
              "handle.bind(progress, move |handle| {",
              "handle.bind(progress, move |mut handle| {",
              1,
          )
          rust.write_text(text)
          PY
          cargo fmt
      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            echo "No source changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add examples/widget_gallery/src/views/animation.rs examples/widget_gallery/resources/themes/animation.css
            git commit -m "fix: make morph redraw binding mutable"
            git push origin HEAD:agent/css-keyframes-level2
          fi
      - name: Parse animation stylesheet in Context
        run: cargo test -p widget_gallery animation_gallery_stylesheet_loads
