name: Animation Docs Smoke

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize Vizia border demo CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('examples/widget_gallery/resources/themes/animation.css')
          text = p.read_text().replace('border-style: solid; ', '').replace('    border-style: solid;\n', '')
          p.write_text(text)
          PY
      - name: Commit normalization if needed
        run: |
          if git diff --quiet; then
            echo "No normalization required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add examples/widget_gallery/resources/themes/animation.css
            git commit -m "fix: keep animation border demos Vizia-native"
            git push origin HEAD:agent/css-keyframes-level2
          fi
      - name: Animation stylesheet smoke test
        run: cargo test -p widget_gallery animation_gallery_stylesheet_loads
