name: Keyframes Gallery Fix

on:
  push:
    branches: [ agent/css-keyframes-level1-complete ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level1-complete
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxcb-dri2-0-dev libgl1-mesa-dev libxcb-icccm4-dev libxcursor-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfreetype6-dev libfontconfig1-dev libwayland-dev
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check widget gallery
        run: cargo check -p widget_gallery
      - name: Load animation gallery stylesheet
        run: cargo test -p widget_gallery animation_gallery_stylesheet_loads
      - name: Run core library tests
        run: cargo test -p vizia_core --lib
