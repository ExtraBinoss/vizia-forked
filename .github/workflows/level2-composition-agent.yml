name: Level 2 Composition Agent

on:
  pull_request:
    branches: [ agent/css-keyframes-level1-complete ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb-dev libxcb-dri2-0-dev libgl1-mesa-dev libxcb-icccm4-dev \
            libxcursor-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfreetype6-dev libfontconfig1-dev libwayland-dev
      - name: Preflight materializer
        run: python tools/level2_composition_preflight.py
      - name: Apply Level 2 composition phase
        run: python tools/level2_composition.py
      - name: Format
        run: cargo fmt
      - name: Test style parser
        run: cargo test -p vizia_style
      - name: Check core
        run: cargo check -p vizia_core --lib
      - name: Check widget gallery
        run: cargo check -p widget_gallery
      - name: Verify formatting
        run: cargo fmt -- --check
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/vizia_style/src/values/animation.rs \
            crates/vizia_style/src/property.rs \
            crates/vizia_core/src/animation/interpolator.rs \
            crates/vizia_core/src/animation/animation_state.rs \
            crates/vizia_core/src/animation/mod.rs \
            crates/vizia_core/src/style/mod.rs \
            crates/vizia_core/src/systems/style.rs \
            crates/vizia_core/src/style/css_animation.rs \
            crates/vizia_core/src/storage/animatable_set.rs \
            crates/vizia_core/src/storage/animatable_var_set.rs
          git commit -m "feat: add Level 2 animation composition"
          git push origin HEAD:agent/css-keyframes-level2
