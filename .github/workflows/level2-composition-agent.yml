# Temporary materializer; removed after the composition phase is validated.
name: Level 2 Composition Agent

on:
  push:
    branches: [ agent/css-keyframes-level2 ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Preflight materializer
        run: python tools/level2_composition_preflight.py
      - name: Apply Level 2 composition phase
        run: python tools/level2_composition.py
      - name: Format
        run: cargo fmt
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/vizia_style/src/values/animation.rs \
            crates/vizia_style/src/property.rs \
            crates/vizia_core/src/animation/interpolator.rs \
            crates/vizia_core/src/animation/animation_state.rs \
            crates/vizia_core/src/animation/mod.rs \
            crates/vizia_core/src/style/mod.rs \
            crates/vizia_core/src/systems/style.rs \
            crates/vizia_core/src/style/css_animation.rs \
            crates/vizia_core/src/storage/animatable_set.rs \
            crates/vizia_core/src/storage/animatable_var_set.rs
          git commit -m "feat: add Level 2 animation composition"
          git push origin HEAD:agent/css-keyframes-level2
