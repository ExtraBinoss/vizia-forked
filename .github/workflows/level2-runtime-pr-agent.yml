name: Level 2 Finalization Agent

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply runtime follow-up and full-size gallery
        run: python tools/level2_finish.py
      - name: Format
        run: cargo fmt
      - name: Commit final source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/vizia_core/src/storage/animatable_set.rs \
            crates/vizia_core/src/storage/animatable_var_set.rs \
            crates/vizia_core/src/style/css_animation.rs \
            examples/widget_gallery/src/views/animation.rs \
            examples/widget_gallery/resources/themes/animation.css
          git commit -m "feat: finish Level 2 animation showcase"
          git push origin HEAD:agent/css-keyframes-level2
