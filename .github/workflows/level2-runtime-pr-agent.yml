name: Level 2 Polish Agent

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply coherence fixes
        run: python tools/level2_polish.py
      - name: Format
        run: cargo fmt
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/vizia_core/src/animation/runtime.rs \
            crates/vizia_core/src/style/css_animation.rs
          git commit -m "fix: keep Level 2 runtime sampling coherent"
          git push origin HEAD:agent/css-keyframes-level2
