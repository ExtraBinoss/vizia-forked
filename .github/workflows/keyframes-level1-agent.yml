name: Keyframes Level 1 Agent

on:
  push:
    branches: [ agent/css-keyframes-level1-complete ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: keyframes-level1-source-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level1-complete
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: css-keyframes-level1-macos
          cache-on-failure: true
      - name: Apply final source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f"anchor not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "crates/vizia_style/src/parser/rule.rs",
              '''                let mut parser = KeyframeListParser;
                let iter = RuleBodyParser::new(input, &mut parser);
                self.rules.0.push(CssRule::Keyframes(KeyframesRule {
                    name,
                    keyframes: iter.filter_map(Result::ok).collect(),
                    loc,
                }));
                Ok(())
''',
              '''                let mut parser = KeyframeListParser;
                let mut iter = RuleBodyParser::new(input, &mut parser);
                let mut keyframes = Vec::new();
                while let Some(result) = iter.next() {
                    match result {
                        Ok(keyframe) => keyframes.push(keyframe),
                        Err((error, _)) => {
                            if self.options.error_recovery {
                                self.options.warn(error);
                                continue;
                            }
                            return Err(error);
                        }
                    }
                }
                self.rules.0.push(CssRule::Keyframes(KeyframesRule { name, keyframes, loc }));
                Ok(())
''',
          )
          replace_once(
              "crates/vizia_style/src/values/color.rs",
              "        Self::rgba(rgba.red, rgba.green, rgba.blue, (rgba.alpha * 255.0) as u8)\n",
              "        Self::rgba(rgba.red, rgba.green, rgba.blue, srgb_to_u8(rgba.alpha))\n",
          )
          replace_once(
              "crates/vizia_style/src/values/letter_spacing.rs",
              '''        let location = input.current_source_location();
        let length = input.try_parse(Length::parse)?;
''',
              '''        let location = input.current_source_location();
        if input
            .try_parse(|input| {
                let value = input.expect_number()?;
                if value == 0.0 {
                    Ok(())
                } else {
                    Err(input.new_custom_error(CustomParseError::InvalidValue))
                }
            })
            .is_ok()
        {
            return Ok(LetterSpacing::Length(Length::Value(crate::LengthValue::Px(0.0))));
        }
        let length = input.try_parse(Length::parse)?;
''',
          )
          PY
          cargo fmt --all
      - name: Materialize final source fixes
        run: |
          if git diff --quiet; then
            echo "No source fixes to commit"
            exit 0
          fi
          git config user.name "OpenAI Keyframes Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/vizia_style/src/parser/rule.rs crates/vizia_style/src/values/color.rs crates/vizia_style/src/values/letter_spacing.rs
          git commit -m "fix(css): validate keyframes and parser edge cases"
          git pull --rebase origin agent/css-keyframes-level1-complete
          git push origin HEAD:agent/css-keyframes-level1-complete
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test style parser
        run: cargo test -p vizia_style
      - name: Test core library
        run: cargo test -p vizia_core --lib
      - name: Check widget gallery
        run: cargo check -p widget_gallery
      - name: Clippy changed crates
        run: cargo clippy -p vizia_style -p vizia_core --lib -- -D warnings
