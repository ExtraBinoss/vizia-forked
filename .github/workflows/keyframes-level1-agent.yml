name: Keyframes Level 1 Agent

on:
  push:
    branches: [ agent/css-keyframes-level1-complete ]
    paths:
      - tools/keyframes_level1_apply.py
      - .github/workflows/keyframes-level1-agent.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level1-complete
          fetch-depth: 0
      - name: Install XCB and GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxcb-dri2-0-dev libgl1-mesa-dev libxcb-icccm4-dev libxcursor-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply implementation patch
        run: python3 tools/keyframes_level1_apply.py
      - name: Format
        run: cargo fmt --all
      - name: Test style parser
        run: cargo test -p vizia_style
      - name: Test core library
        run: cargo test -p vizia_core --lib
      - name: Clippy changed crates
        run: cargo clippy -p vizia_style -p vizia_core --lib -- -D warnings
      - name: Commit generated implementation
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "OpenAI Keyframes Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement CSS Animations Level 1 parser foundation"
          git push origin HEAD:agent/css-keyframes-level1-complete
