name: Animation Docs Runner

on:
  pull_request:
    branches: [ agent/css-keyframes-level2 ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/css-keyframes-level2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reference fixes
        run: |
          python tools/animation_doc_followup.py
          cargo fmt
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes"
          else
            git add examples/widget_gallery/src/views/animation.rs examples/widget_gallery/resources/themes/animation.css
            git commit -m "fix: polish live animation reference examples"
            git push origin HEAD:agent/css-keyframes-level2
          fi
